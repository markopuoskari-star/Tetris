<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Leevin villapaitapeli</title>
<style>
  :root{--ink:#2b2420;--muted:#7a6b60;--accent:#c0392b;--font:system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);background:linear-gradient(170deg,#f6efe6,#e3d3bf) fixed;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;
       user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
  h1{margin:0;font-size:18px;letter-spacing:.04em}
  #wrap{position:relative;width:min(100%,calc((100vh - 90px) * .6));aspect-ratio:3/5;border-radius:20px;overflow:hidden;
        box-shadow:0 10px 30px rgba(60,40,20,.25)}
  canvas{display:block;width:100%;height:100%}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      text-align:center;padding:24px;background:rgba(246,239,230,.88)}
  #ov[hidden]{display:none}
  #ov h2{margin:0;font-size:26px}
  #ov p{margin:0;color:var(--muted);line-height:1.45;font-size:15px}
  button{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 32px;cursor:pointer}
  small{color:var(--muted)}
</style>
</head>
<body>
<h1>Leevin villapaitapeli</h1>
<div id="wrap">
  <canvas id="c" width="360" height="600"></canvas>
  <div id="ov">
    <h2>Leevin villapaita</h2>
    <p>Auta Leevi kutomaan villapaita! Kerää putoavat lankakerät, mutta väistä koit. Jokainen kerä kutoo yhden kerroksen paitaan.</p>
    <p><small>Puhelin: vedä sormella · Tietokone: nuolet tai A/D · P tauottaa</small></p>
    <button id="go">Aloita</button>
  </div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=360,H=600;
const ov=document.getElementById('ov'),go=document.getElementById('go');
const COLORS=['#c0392b','#2e6da4','#e0a82e','#3f8f5a','#8e5ba8'];
const GROUND=H-40,ROWS=12;
let best=0;try{best=+localStorage.getItem('villapaita_best')||0}catch(e){}
let s,keys={},target=null,last=0,running=false,paused=false;

function reset(){
  s={x:W/2,items:[],rows:[],lives:3,score:0,t:0,spawn:0,combo:0,flash:0,done:false};
}
function rnd(a,b){return a+Math.random()*(b-a)}
function spawn(){
  const r=Math.random(),lvl=1+Math.floor(s.score/10);
  const type=r<.2+Math.min(.15,lvl*.015)?'moth':(r>.96?'gold':'wool');
  s.items.push({type,x:rnd(24,W-24),y:-20,vy:rnd(120,170)+lvl*14,c:COLORS[Math.random()*COLORS.length|0],ph:rnd(0,6)});
}
function knit(gold){
  const n=gold?3:1;
  for(let i=0;i<n;i++){
    if(s.rows.length>=ROWS){s.rows=[];s.flash=1;s.lives=Math.min(5,s.lives+1)}   // valmis paita: uusi aloitus + lisäelämä
    s.rows.push(COLORS[Math.random()*COLORS.length|0]);
  }
  s.score+=n;
}
function end(){
  s.done=true;running=false;
  const nb=s.score>best;if(nb){best=s.score;try{localStorage.setItem('villapaita_best',best)}catch(e){}}
  ov.hidden=false;
  ov.innerHTML=`<h2>Koit voittivat!</h2><p>Kudoit ${s.score} kerrosta.<br>${nb?'Uusi ennätys!':'Ennätys: '+best}</p><button id="go">Uudestaan</button>`;
  document.getElementById('go').onclick=start;
}
function start(){reset();ov.hidden=true;running=true;paused=false;last=performance.now();requestAnimationFrame(loop)}
go.onclick=start;

function update(dt){
  s.t+=dt;
  const sp=300;
  if(keys.ArrowLeft||keys.a)s.x-=sp*dt;
  if(keys.ArrowRight||keys.d)s.x+=sp*dt;
  if(target!==null)s.x+=Math.max(-sp*1.6*dt,Math.min(sp*1.6*dt,target-s.x));
  s.x=Math.max(30,Math.min(W-30,s.x));
  s.spawn-=dt;
  if(s.spawn<=0){spawn();s.spawn=Math.max(.35,.9-s.score*.012)}
  for(const it of s.items){
    it.y+=it.vy*dt;
    if(it.type==='moth')it.x+=Math.sin(s.t*5+it.ph)*50*dt;
    if(!it.hit&&it.y>GROUND-70&&it.y<GROUND-10&&Math.abs(it.x-s.x)<34){
      it.hit=true;
      if(it.type==='moth'){s.lives--;s.combo=0;s.flash=-1;if(s.lives<=0)end()}
      else knit(it.type==='gold');
    }
  }
  s.items=s.items.filter(i=>!i.hit&&i.y<H+30);
  s.flash*=Math.pow(.02,dt);
}

function ball(x,y,r,c){
  g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;
  for(let i=-1;i<=1;i++){g.beginPath();g.ellipse(x,y,r*.9,r*(.35+i*.3),i*.6,0,7);g.stroke()}
}
function moth(x,y,t){
  const f=Math.sin(t*25)*.4;
  g.fillStyle='#6b5b4e';
  for(const d of[-1,1]){g.save();g.translate(x,y);g.scale(d,1);g.rotate(f*.8);
    g.beginPath();g.ellipse(11,-2,12,7,-.3,0,7);g.fill();g.restore()}
  g.fillStyle='#3b3028';g.beginPath();g.ellipse(x,y+1,3.5,9,0,0,7);g.fill();
}
function leevi(x,y){
  // vartalo = villapaita, kerrokset kasvavat alhaalta ylös
  const bw=56,bh=72,top=y-bh;
  g.fillStyle='#e8d9c4';g.fillRect(x-bw/2,top,bw,bh);                        // kudottava paita (tyhjä pohja)
  g.save();g.beginPath();g.rect(x-bw/2,top,bw,bh);g.clip();
  const rh=bh/ROWS;
  s.rows.forEach((c,i)=>{
    const ry=y-(i+1)*rh;g.fillStyle=c;g.fillRect(x-bw/2,ry,bw,rh);
    g.fillStyle='rgba(255,255,255,.55)';                                      // pohjoismainen kuvio
    for(let k=0;k<bw;k+=8){const o=i%2?4:0;g.fillRect(x-bw/2+k+o,ry+rh/2-1.5,3,3)}
  });
  g.restore();
  g.strokeStyle='#5a4a3c';g.lineWidth=2;g.strokeRect(x-bw/2,top,bw,bh);
  g.fillStyle='#e8d9c4';g.fillRect(x-bw/2-12,top+4,12,40);g.fillRect(x+bw/2,top+4,12,40); // hihat
  g.fillStyle='#f2c9a0';g.beginPath();g.arc(x,top-16,17,0,7);g.fill();        // pää
  g.fillStyle='#4a3626';g.beginPath();g.arc(x,top-22,17,Math.PI,0);g.fill();   // hiukset
  g.fillStyle='#222';g.fillRect(x-7,top-16,3,3);g.fillRect(x+4,top-16,3,3);
  g.strokeStyle='#222';g.lineWidth=1.5;g.beginPath();g.arc(x,top-10,5,.2,Math.PI-.2);g.stroke();
  g.fillStyle='#3a4a6a';g.fillRect(x-20,y,16,26);g.fillRect(x+4,y,16,26);     // housut
}
function draw(){
  const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#cfe3f2');sky.addColorStop(1,'#f3ead9');
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.globalAlpha=.7;                                          // lumihiutaleet
  for(let i=0;i<30;i++){g.fillRect((i*97+s.t*8*(1+i%3))%W,(i*61+s.t*25*(1+i%2))%H,2,2)}
  g.globalAlpha=1;
  g.fillStyle='#fafafa';g.fillRect(0,GROUND,W,H-GROUND);
  g.fillStyle='#dfe8ef';g.fillRect(0,GROUND,W,4);
  for(const it of s.items){
    if(it.type==='moth')moth(it.x,it.y,s.t+it.ph);
    else ball(it.x,it.y,it.type==='gold'?17:13,it.type==='gold'?'#f5c518':it.c);
  }
  leevi(s.x,GROUND);
  if(Math.abs(s.flash)>.02){g.fillStyle=s.flash>0?`rgba(255,230,120,${s.flash*.5})`:`rgba(200,40,40,${-s.flash*.4})`;g.fillRect(0,0,W,H)}
  g.fillStyle='#2b2420';g.font='800 22px system-ui,sans-serif';g.textAlign='left';g.fillText(s.score,16,34);
  g.font='600 12px system-ui,sans-serif';g.fillStyle='#7a6b60';g.fillText('Ennätys '+best,16,52);
  g.textAlign='right';g.font='20px system-ui,sans-serif';g.fillStyle='#c0392b';g.fillText('♥'.repeat(Math.max(0,s.lives)),W-16,34);
}
function loop(t){
  if(!running)return;
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!paused)update(dt);
  if(running)draw();
  if(running)requestAnimationFrame(loop);
}
function pos(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{target=pos(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')target=pos(e)});
addEventListener('pointerup',()=>{target=null});
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='p'||e.key==='P'){paused=!paused}
  if(e.key.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key]=false});
reset();draw();
})();
</script>
</body>
</html>
